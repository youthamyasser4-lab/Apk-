<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مصاريفنا</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d4e6b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#14212b;--mute:#66767f;--line:#dbe3e7;--in:#0f8a6d;--out:#c8445a;--brand:#1d4e6b}
@media(prefers-color-scheme:dark){:root{--bg:#10181d;--card:#192329;--ink:#e8eef1;--mute:#93a3ab;--line:#2a373e;--in:#3fc9a3;--out:#ef7a8d;--brand:#6fb3d6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.6}
main{max-width:520px;margin:0 auto;padding:16px}
h1,h2,h3{margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px}
button{border:0;border-radius:10px;padding:10px 16px;background:var(--brand);color:#fff;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--brand);border:1px solid var(--line)}
button.link{background:none;color:var(--mute);padding:4px 8px;font-weight:400}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.acc{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.acc b{font-size:1.5rem}
.tag{font-size:.75rem;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:0 8px;margin-right:6px;color:var(--mute)}
.in{color:var(--in)}.out{color:var(--out)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center}
.sum div{background:var(--bg);border-radius:10px;padding:8px}
.big{font-size:2.2rem;font-weight:800;text-align:center;margin:4px 0 10px}
.tx{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.mute{color:var(--mute);font-size:.85rem}
.err{color:var(--out);min-height:1.5em;font-size:.9rem}
.seg{display:flex;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:var(--bg);color:var(--mute)}
.seg button.on.e{background:var(--out);color:#fff}.seg button.on.i{background:var(--in);color:#fff}
.chips{flex-wrap:wrap;margin-bottom:10px}.chips button{flex:none;padding:2px 12px;font-size:.85rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}.tabs a{white-space:nowrap;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none}.tabs a.on{background:var(--brand);color:#fff;border-color:var(--brand)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// === غيّر القيمتين دول من Supabase: Project Settings > API ===
const SUPABASE_URL = "https://ikdaevodinllnrelvsxi.supabase.co";
const SUPABASE_KEY = "sb_publishable_P28yhr1KLFUJoUuyf_aqMw_TtAx4EeG";
// =============================================================

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
const CATS = ["أكل","مواصلات","فواتير","بيت","صحة","ترفيه","مرتب","أخرى"];
let user = null, kind = "expense";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => Number(n).toLocaleString("ar-EG", {maximumFractionDigits: 2});
const today = () => new Date().toISOString().slice(0, 10);
const $ = id => document.getElementById(id);
const fail = e => { const el = $("err"); if (el) el.textContent = e.message || e; };

db.auth.onAuthStateChange((_e, session) => { user = session?.user ?? null; route(); });
window.addEventListener("hashchange", route);

function route() {
  if (!user) return authView();
  const m = location.hash.match(/^#\/a\/(.+)$/);
  m ? accountView(m[1]) : homeView();
}

function authView() {
  app.innerHTML = `
    <h1 style="margin:40px 0 4px">مصاريفنا</h1>
    <p class="mute" style="margin-bottom:20px">سجّل الدخل والصرف لوحدك أو مع حد.</p>
    <div class="card">
      <input id="em" type="email" placeholder="الإيميل" autocomplete="email">
      <input id="pw" type="password" placeholder="الباسورد (6 حروف على الأقل)" autocomplete="current-password">
      <p class="err" id="err"></p>
      <div class="row"><button id="login">دخول</button><button class="ghost" id="signup">حساب جديد</button></div>
    </div>`;
  const creds = () => ({email: $("em").value.trim().toLowerCase(), password: $("pw").value});
  $("login").onclick = async () => { const {error} = await db.auth.signInWithPassword(creds()); if (error) fail(error); };
  $("signup").onclick = async () => {
    const {data, error} = await db.auth.signUp(creds());
    if (error) return fail(error);
    if (!data.session) fail("اتبعتلك إيميل تأكيد. أكّده وبعدين ادخل.");
  };
}

async function homeView() {
  app.innerHTML = `<p class="mute">بحمّل...</p>`;
  const [acc, inv, mem, tx] = await Promise.all([
    db.from("accounts").select("id,name,owner_id").order("created_at"),
    db.from("account_members").select("id,account_id,accounts(name)").eq("status","pending").eq("email", user.email.toLowerCase()),
    db.from("account_members").select("account_id"),
    db.from("transactions").select("account_id,kind,amount")
  ]);
  const myAcc = (acc.data || []).filter(a => !(inv.data || []).some(i => i.account_id === a.id) || a.owner_id === user.id || (mem.data||[]).some(m => m.account_id === a.id));
  const bal = {}, cnt = {};
  (tx.data || []).forEach(t => bal[t.account_id] = (bal[t.account_id] || 0) + (t.kind === "income" ? 1 : -1) * Number(t.amount));
  (mem.data || []).forEach(m => cnt[m.account_id] = (cnt[m.account_id] || 0) + 1);
  const invHtml = (inv.data || []).map(i => `
    <div class="card"><b>دعوة لحساب: ${esc(i.accounts?.name || "")}</b>
      <div class="row" style="margin-top:8px"><button data-ok="${i.id}">قبول</button><button class="ghost" data-no="${i.id}">رفض</button></div></div>`).join("");
  const accHtml = myAcc.filter(a => (mem.data || []).some(m => m.account_id === a.id) && !(inv.data || []).some(i => i.account_id === a.id)).map(a => {
    const b = bal[a.id] || 0;
    return `<div class="card acc" tabindex="0" role="link" data-go="${a.id}">
      <div><b style="font-size:1.1rem">${esc(a.name)}</b>${cnt[a.id] > 1 ? '<span class="tag">مشترك</span>' : ""}</div>
      <b class="${b >= 0 ? "in" : "out"}">${money(b)}</b></div>`;
  }).join("");
  app.innerHTML = `
    <div class="top"><h2>حساباتي</h2><button class="link" id="out">خروج</button></div>
    ${invHtml}${accHtml || '<p class="mute">لسه معندكش حسابات. اعمل أول حساب من تحت.</p>'}
    <div class="card"><h3 style="margin-bottom:8px">حساب جديد</h3><input id="nm" placeholder="اكتب اسم الحساب"><div class="row chips"><button class="ghost" data-n="حساب البيت">البيت</button><button class="ghost" data-n="حساب الشغل">الشغل</button><button class="ghost" data-n="حساب الاستثمار">الاستثمار</button></div><p class="err" id="err"></p><button id="add">إضافة حساب</button></div>`;
  $("out").onclick = () => db.auth.signOut();
  document.querySelectorAll("[data-go]").forEach(el => {
    const go = () => location.hash = "#/a/" + el.dataset.go;
    el.onclick = go; el.onkeydown = e => e.key === "Enter" && go();
  });
  document.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
    const {error} = await db.from("account_members").update({user_id: user.id, status: "accepted"}).eq("id", b.dataset.ok);
    error ? alert(error.message) : homeView();
  });
  document.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => {
    await db.from("account_members").delete().eq("id", b.dataset.no); homeView();
  });
  document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { $("nm").value = b.dataset.n; $("nm").focus(); });
  $("add").onclick = async () => {
    const name = $("nm").value.trim(); if (!name) return fail("اكتب اسم الحساب");
    const {data, error} = await db.rpc("create_account", {acc_name: name});
    error ? fail(error) : location.hash = "#/a/" + data;
  };
}

async function accountView(id) {
  app.innerHTML = `<p class="mute">بحمّل...</p>`;
  const [a, tx, mem, tabs] = await Promise.all([
    db.from("accounts").select("id,name,owner_id").eq("id", id).maybeSingle(),
    db.from("transactions").select("*").eq("account_id", id).order("date", {ascending: false}).order("created_at", {ascending: false}),
    db.from("account_members").select("id,email,role,status").eq("account_id", id),
    db.from("account_members").select("accounts(id,name)").eq("user_id", user.id).eq("status", "accepted")
  ]);
  if (!a.data) { location.hash = ""; return; }
  const isOwner = a.data.owner_id === user.id, list = tx.data || [], members = mem.data || [];
  const inc = list.filter(t => t.kind === "income").reduce((s, t) => s + Number(t.amount), 0);
  const exp = list.filter(t => t.kind === "expense").reduce((s, t) => s + Number(t.amount), 0);
  const who = {}; members.forEach(m => who[m.email] = m);
  app.innerHTML = `
    <div class="top"><button class="link" id="back">رجوع</button><h2>${esc(a.data.name)}</h2><span></span></div>
    <nav class="tabs">${(tabs.data || []).map(t => t.accounts).filter(Boolean).map(t => `<a href="#/a/${t.id}" class="${t.id === id ? "on" : ""}">${esc(t.name)}</a>`).join("")}<a href="#">+ حساب</a></nav>
    <div class="card"><p class="mute" style="text-align:center;margin:0">رصيد ${esc(a.data.name)} فقط</p>
      <div class="big ${inc - exp >= 0 ? "in" : "out"}">${money(inc - exp)}</div>
      <div class="sum"><div><span class="mute">دخل</span><br><b class="in">${money(inc)}</b></div><div><span class="mute">صرف</span><br><b class="out">${money(exp)}</b></div></div></div>
    <div class="card">
      <div class="seg"><button id="kE" class="e">مصروف</button><button id="kI" class="i">دخل</button></div>
      <input id="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="المبلغ">
      <select id="cat">${CATS.map(c => `<option>${c}</option>`).join("")}</select>
      <input id="dt" type="date" value="${today()}">
      <input id="note" placeholder="ملاحظة (اختياري)">
      <p class="err" id="err"></p><button id="save" style="width:100%">حفظ</button></div>
    <div class="card"><h3 style="margin-bottom:6px">المعاملات</h3>
      ${list.map(t => `<div class="tx"><div><b>${esc(t.category || "")}</b> <span class="mute">${esc(t.note || "")}</span><br>
        <span class="mute">${esc(t.date)}</span></div>
        <div style="text-align:left"><b class="${t.kind === "income" ? "in" : "out"}">${t.kind === "income" ? "+" : "-"}${money(t.amount)}</b>
        ${(t.user_id === user.id || isOwner) ? `<br><button class="link" data-del="${t.id}">حذف</button>` : ""}</div></div>`).join("") || '<p class="mute">مفيش معاملات لسه.</p>'}</div>
    <div class="card"><h3 style="margin-bottom:6px">الأعضاء</h3>
      ${members.map(m => `<div class="tx"><span>${esc(m.email)}${m.role === "owner" ? '<span class="tag">المالك</span>' : ""}${m.status === "pending" ? '<span class="tag">في انتظار القبول</span>' : ""}</span>
        ${isOwner && m.role !== "owner" ? `<button class="link" data-rm="${m.id}">إزالة</button>` : ""}</div>`).join("")}
      ${isOwner ? `<input id="inv" type="email" placeholder="إيميل الشخص" style="margin-top:10px"><button id="send" class="ghost" style="width:100%">إرسال دعوة</button>` : ""}</div>
    ${isOwner ? '<button class="link" id="delacc" style="color:var(--out)">حذف الحساب بالكامل</button>' : ""}`;
  $("back").onclick = () => location.hash = "";
  const setKind = k => { kind = k; $("kE").classList.toggle("on", k === "expense"); $("kI").classList.toggle("on", k === "income"); };
  $("kE").onclick = () => setKind("expense"); $("kI").onclick = () => setKind("income"); setKind(kind);
  $("save").onclick = async () => {
    const amount = parseFloat($("amt").value);
    if (!(amount > 0)) return fail("اكتب مبلغ صحيح");
    const {error} = await db.from("transactions").insert({account_id: id, user_id: user.id, kind, amount, category: $("cat").value, note: $("note").value.trim(), date: $("dt").value || today()});
    error ? fail(error) : accountView(id);
  };
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (confirm("تمسح المعاملة دي؟")) { await db.from("transactions").delete().eq("id", b.dataset.del); accountView(id); }
  });
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (confirm("تشيل العضو ده؟")) { await db.from("account_members").delete().eq("id", b.dataset.rm); accountView(id); }
  });
  if (isOwner) $("delacc").onclick = async () => {
    if (confirm("هيتمسح الحساب وكل معاملاته لكل الأعضاء. متأكد؟")) { await db.from("accounts").delete().eq("id", id); location.hash = ""; }
  };
  if (isOwner) $("send").onclick = async () => {
    const email = $("inv").value.trim().toLowerCase(); if (!email) return fail("اكتب الإيميل");
    const {error} = await db.from("account_members").insert({account_id: id, email, role: "member", status: "pending"});
    error ? fail(error.code === "23505" ? "الشخص ده مدعو بالفعل" : error) : accountView(id);
  };
}

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
db.auth.getSession().then(({data}) => { user = data.session?.user ?? null; route(); });
</script>
</body>
</html>
